<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/task-reward-ledger/manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Task & Reward Ledger</title>
<meta name="theme-color" content="#16302C" />
<link rel="icon" href="data:," />
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    onSnapshot,
    updateDoc,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAAOGdr4lx16d4ux3r9ZWKx1B-PfgCemL0",
    authDomain: "task-reward-ledger.firebaseapp.com",
    projectId: "task-reward-ledger",
    storageBucket: "task-reward-ledger.firebasestorage.app",
    messagingSenderId: "129914738583",
    appId: "1:129914738583:web:96fa5aa7d00c2ade61d6d2",
    measurementId: "G-T1DQKMNF09"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const familyId = "collette-family";
  const tasksRef = collection(db, "families", familyId, "tasks");

  const state = {
    tasks: [],
    filter: "all",
    ownerFilter: "all",
    user: null
  };

  let unsubscribeTasks = null;

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = String(str ?? "");
    return div.innerHTML;
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    if (!el) return;
    el.textContent = msg;
    el.style.display = "block";
  }

  function hideError() {
    const el = document.getElementById("errorMsg");
    if (!el) return;
    el.style.display = "none";
    el.textContent = "";
  }

  function clearSubscription() {
    if (unsubscribeTasks) {
      unsubscribeTasks();
      unsubscribeTasks = null;
    }
  }

  function getOwnerLabel(value) {
    if (value === "me") return "Me";
    if (value === "wife") return "Wife";
    return "Shared";
  }

  function startListening() {
    clearSubscription();
    const q = query(tasksRef, orderBy("createdAt", "desc"));

    unsubscribeTasks = onSnapshot(
      q,
      (snap) => {
        state.tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        hideError();
        render();
      },
      (err) => {
        console.error(err);
        showError("Could not load tasks from Firestore. Check your rules and connection.");
      }
    );
  }

  async function signIn() {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (err) {
      console.error(err);
      showError("Sign-in failed. Make sure Google sign-in is enabled in Firebase Auth.");
    }
  }

  async function signOutUser() {
    try {
      await signOut(auth);
    } catch (err) {
      console.error(err);
      showError("Could not sign out.");
    }
  }

  async function addTask() {
    const titleInput = document.getElementById("taskInput");
    const rewardInput = document.getElementById("rewardInput");
    const ownerInput = document.getElementById("ownerInput");

    const title = titleInput.value.trim();
    const reward = rewardInput.value.trim();
    const owner = ownerInput.value;

    if (!title) return;

    try {
      await addDoc(tasksRef, {
        title,
        reward: reward || "No reward set",
        owner,
        taskDone: false,
        rewardDone: false,
        createdAt: Date.now()
      });

      titleInput.value = "";
      rewardInput.value = "";
      ownerInput.value = "shared";
      hideError();
    } catch (err) {
      console.error(err);
      showError("Could not save the task. Check Firestore rules.");
    }
  }

  async function toggleTask(id) {
    const task = state.tasks.find((e) => e.id === id);
    if (!task) return;

    try {
      const nowDone = !task.taskDone;
      await updateDoc(doc(db, "families", familyId, "tasks", id), {
        taskDone: nowDone,
        rewardDone: nowDone ? task.rewardDone : false
      });
    } catch (err) {
      console.error(err);
      showError("Could not update the task.");
    }
  }

  async function toggleReward(id) {
    const task = state.tasks.find((e) => e.id === id);
    if (!task || !task.taskDone) return;

    try {
      await updateDoc(doc(db, "families", familyId, "tasks", id), {
        rewardDone: !task.rewardDone
      });
    } catch (err) {
      console.error(err);
      showError("Could not update the reward.");
    }
  }

  async function removeEntry(id) {
    try {
      await deleteDoc(doc(db, "families", familyId, "tasks", id));
    } catch (err) {
      console.error(err);
      showError("Could not delete the task.");
    }
  }

  function getVisibleTasks() {
    return state.tasks.filter((e) => {
      if (state.ownerFilter === "mine" && e.owner !== "me") return false;
      if (state.ownerFilter === "hers" && e.owner !== "wife") return false;
      if (state.ownerFilter === "shared" && e.owner !== "shared") return false;

      if (state.filter === "open") return !e.taskDone;
      if (state.filter === "earned") return e.taskDone && !e.rewardDone;
      if (state.filter === "closed") return e.taskDone && e.rewardDone;
      return true;
    });
  }

  function stampSvg(color, label) {
    return '<svg width="40" height="40" viewBox="0 0 40 40">' +
      '<circle cx="20" cy="20" r="18" fill="none" stroke="' + color + '" stroke-width="2"/>' +
      '<circle cx="20" cy="20" r="14" fill="none" stroke="' + color + '" stroke-width="1"/>' +
      '<text x="20" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="500" fill="' + color + '" transform="rotate(-8 20 20)">' + label + '</text>' +
      '</svg>';
  }

  function renderAuth() {
    const status = document.getElementById("authStatus");
    const signInBtn = document.getElementById("signInBtn");
    const signOutBtn = document.getElementById("signOutBtn");

    if (!status || !signInBtn || !signOutBtn) return;

    if (state.user) {
      signInBtn.style.display = "none";
      signOutBtn.style.display = "inline-flex";
      status.textContent = state.user.displayName || state.user.email || "Signed in";
    } else {
      signInBtn.style.display = "inline-flex";
      signOutBtn.style.display = "none";
      status.textContent = "Not signed in";
    }
  }

  function renderStats() {
    const total = state.tasks.length;
    const tasksDone = state.tasks.filter((e) => e.taskDone).length;
    const rewardsClaimed = state.tasks.filter((e) => e.rewardDone).length;
    const html =
      '<div class="stat"><div class="num">' + total + '</div><div class="label">Entries</div></div>' +
      '<div class="stat"><div class="num">' + tasksDone + '</div><div class="label">Tasks done</div></div>' +
      '<div class="stat"><div class="num">' + rewardsClaimed + '</div><div class="label">Rewards claimed</div></div>';
    document.getElementById("stats").innerHTML = html;
  }

  function renderFilters() {
    const statusFilters = [
      { key: "all", label: "All" },
      { key: "open", label: "Open" },
      { key: "earned", label: "Reward pending" },
      { key: "closed", label: "Closed out" }
    ];

    const ownerFilters = [
      { key: "all", label: "Everyone" },
      { key: "mine", label: "Mine" },
      { key: "hers", label: "Hers" },
      { key: "shared", label: "Shared" }
    ];

    const statusHtml = statusFilters.map((f) => {
      const active = f.key === state.filter ? " active" : "";
      return '<button class="filter-btn' + active + '" data-filter-type="status" data-filter="' + f.key + '">' + f.label + '</button>';
    }).join("");

    const ownerHtml = ownerFilters.map((f) => {
      const active = f.key === state.ownerFilter ? " active" : "";
      return '<button class="filter-btn' + active + '" data-filter-type="owner" data-filter="' + f.key + '">' + f.label + '</button>';
    }).join("");

    const el = document.getElementById("filters");
    el.innerHTML =
      '<div class="filter-group">' +
        '<div class="group-label">Status</div>' +
        '<div class="filters-row">' + statusHtml + '</div>' +
      '</div>' +
      '<div class="filter-group">' +
        '<div class="group-label">Owner</div>' +
        '<div class="filters-row">' + ownerHtml + '</div>' +
      '</div>';

    Array.prototype.forEach.call(el.querySelectorAll(".filter-btn"), function (btn) {
      btn.addEventListener("click", function () {
        const type = btn.getAttribute("data-filter-type");
        const value = btn.getAttribute("data-filter");
        if (type === "status") state.filter = value;
        if (type === "owner") state.ownerFilter = value;
        render();
      });
    });
  }

  function renderList() {
    const visible = getVisibleTasks();
    const area = document.getElementById("listArea");

    if (visible.length === 0) {
      area.innerHTML = '<div class="empty">' +
        (state.tasks.length === 0
          ? "Nothing in the ledger yet. Add a task and its reward above."
          : "No entries match these filters.") +
        '</div>';
      return;
    }

    const html = '<div class="entries">' + visible.map(function (e) {
      const taskCircle = e.taskDone ? stampSvg("#6E8F73", "DONE") : '<div class="circle"></div>';
      const rewardCircle = e.rewardDone ? stampSvg("#C9973F", "CLAIM") : '<div class="circle"></div>';
      const hint = !e.taskDone ? '<div class="hint">Finish the task to unlock</div>' : "";
      return (
        '<div class="entry">' +
          '<div class="half task">' +
            '<button class="stamp-btn" data-action="task" data-id="' + e.id + '" aria-label="Toggle task">' + taskCircle + '</button>' +
            '<div>' +
              '<div class="label-small task-label">Task • ' + escapeHtml(getOwnerLabel(e.owner)) + '</div>' +
              '<div class="entry-title' + (e.taskDone ? " done" : "") + '">' + escapeHtml(e.title) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="perf"></div>' +
          '<div class="half reward' + (e.taskDone ? " unlocked" : "") + '">' +
            '<button class="stamp-btn" data-action="reward" data-id="' + e.id + '" ' + (e.taskDone ? "" : "disabled") + ' aria-label="Toggle reward">' + rewardCircle + '</button>' +
            '<div>' +
              '<div class="label-small reward-label">Reward</div>' +
              '<div class="entry-reward' + (e.rewardDone ? " done" : "") + '">' + escapeHtml(e.reward) + '</div>' +
              hint +
            '</div>' +
          '</div>' +
          '<button class="remove-btn" data-action="remove" data-id="' + e.id + '" aria-label="Remove entry">&times;</button>' +
        '</div>'
      );
    }).join("") + '</div>';

    area.innerHTML = html;

    Array.prototype.forEach.call(area.querySelectorAll("[data-action]"), function (btn) {
      btn.addEventListener("click", function () {
        const id = btn.getAttribute("data-id");
        const action = btn.getAttribute("data-action");
        if (action === "task") toggleTask(id);
        if (action === "reward") toggleReward(id);
        if (action === "remove") removeEntry(id);
      });
    });
  }

  function renderSignedOut() {
    state.tasks = [];
    render();
    const area = document.getElementById("listArea");
    if (area) {
      area.innerHTML = '<div class="empty">Sign in with Google to see and edit the shared family ledger.</div>';
    }
  }

  function render() {
    renderAuth();
    renderStats();
    renderFilters();
    if (state.user) {
      renderList();
    }
  }

  function init() {
    document.getElementById("addBtn").addEventListener("click", addTask);
    document.getElementById("taskInput").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") addTask();
    });
    document.getElementById("rewardInput").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") addTask();
    });
    document.getElementById("ownerInput").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") addTask();
    });
    document.getElementById("signInBtn").addEventListener("click", signIn);
    document.getElementById("signOutBtn").addEventListener("click", signOutUser);

    onAuthStateChanged(auth, function (user) {
      state.user = user || null;
      hideError();
      renderAuth();

      if (user) {
        startListening();
      } else {
        clearSubscription();
        state.tasks = [];
        renderSignedOut();
      }
    });

    render();
  }

  window.addEventListener("DOMContentLoaded", init);
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --ink: #16302C;
    --parchment: #F3EEE1;
    --parchment-dark: #E7DFCB;
    --gold: #C9973F;
    --gold-deep: #8F6A26;
    --sage: #6E8F73;
    --charcoal: #26261F;
    --muted: #7A7768;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--parchment);
    font-family: 'Source Serif 4', serif;
    color: var(--charcoal);
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: 0 0 4px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 1.25rem;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .auth-card,
  .form-card,
  .stat,
  .entry {
    background: #fff;
    border: 1px solid var(--parchment-dark);
  }

  .auth-card {
    border-radius: 8px;
    padding: 0.9rem 1rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .auth-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .auth-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .auth-status {
    font-size: 14px;
    color: var(--ink);
  }

  .auth-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .auth-btn {
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 6px;
    padding: 9px 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .auth-btn.secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--parchment-dark);
  }

  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .stat {
    flex: 1 1 160px;
    border-radius: 6px;
    padding: 10px 14px;
  }

  .stat .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
  }

  .stat .label {
    font-size: 12px;
    color: var(--muted);
  }

  .form-card {
    border-radius: 8px;
    padding: 1.1rem 1.2rem;
    margin-bottom: 1rem;
  }

  .form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  input[type="text"], select {
    flex: 1 1 200px;
    padding: 9px 12px;
    border: 1px solid var(--parchment-dark);
    border-radius: 6px;
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    background: var(--parchment);
    color: var(--charcoal);
  }

  input[type="text"]:focus, select:focus {
    outline: 2px solid var(--sage);
    outline-offset: 1px;
  }

  button.add-btn {
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }

  .filters {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }

  .filter-group {
    padding: 0;
  }

  .group-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: 0 0 6px;
  }

  .filters-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--parchment-dark);
    border-radius: 20px;
    padding: 5px 13px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--ink);
    color: var(--parchment);
    border-color: var(--ink);
  }

  .empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--muted);
    font-size: 15px;
  }

  .entries {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .entry {
    display: flex;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
    position: relative;
  }

  .half {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .half.task { flex: 1.3; }
  .half.reward { flex: 1; background: var(--parchment); }
  .half.reward.unlocked { background: #FEFCF6; }

  .perf {
    width: 1px;
    align-self: stretch;
    position: relative;
    border-left: 2px dashed var(--parchment-dark);
  }
  .perf::before, .perf::after {
    content: "";
    position: absolute;
    left: -9px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--ink);
  }
  .perf::before { top: -9px; }
  .perf::after { bottom: -9px; }

  .stamp-btn {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
  }

  .stamp-btn:disabled { cursor: not-allowed; opacity: 0.4; }

  .circle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--parchment-dark);
  }

  .label-small {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .label-small.task-label { color: var(--muted); }
  .label-small.reward-label { color: var(--gold-deep); }

  .entry-title { font-size: 16px; }
  .entry-reward { font-size: 15px; }
  .done { text-decoration: line-through; color: var(--muted); }

  .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .remove-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0 12px;
    font-size: 16px;
  }

  .error-msg {
    color: #8F3B2A;
    font-size: 13px;
    margin: 0 0 12px;
  }

  @media (max-width: 640px) {
    h1 { font-size: 30px; }
    .half { padding: 12px 12px; }
    .entry { align-items: stretch; }
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Ledger of tasks &amp; their rewards</p>
  <h1>Earn it, then claim it</h1>

  <div class="auth-card">
    <div class="auth-left">
      <div class="auth-label">Account</div>
      <div class="auth-status" id="authStatus">Not signed in</div>
    </div>
    <div class="auth-actions">
      <button class="auth-btn" id="signInBtn">Sign in with Google</button>
      <button class="auth-btn secondary" id="signOutBtn" style="display:none;">Sign out</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="form-card">
    <div class="form-row">
      <input type="text" id="taskInput" placeholder="Task — e.g. Finish quarterly report" />
      <input type="text" id="rewardInput" placeholder="Reward — e.g. 30 min of a new game" />
      <select id="ownerInput" aria-label="Task owner">
        <option value="shared">Shared</option>
        <option value="me">Me</option>
        <option value="wife">Wife</option>
      </select>
    </div>
    <button class="add-btn" id="addBtn">Add to ledger</button>
  </div>

  <div class="error-msg" id="errorMsg" style="display:none;"></div>

  <div class="filters" id="filters"></div>

  <div id="listArea"></div>
</div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/task-reward-ledger/sw.js");
  });
}
</script>
</body>
</html>
