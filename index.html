<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Task & Reward Ledger</title>
  <link rel="manifest" href="/task-reward-ledger/manifest.webmanifest">
  <meta name="theme-color" content="#16302C" />
  <link rel="icon" href="data:," />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap');

    :root {
      --ink: #16302C;
      --parchment: #F3EEE1;
      --parchment-dark: #E7DFCB;
      --gold: #C9973F;
      --gold-deep: #8F6A26;
      --sage: #6E8F73;
      --charcoal: #26261F;
      --muted: #7A7768;
      --surface: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--parchment);
      font-family: 'Source Serif 4', serif;
      color: var(--charcoal);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin: 0;
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .auth-box button {
      border: 1px solid var(--parchment-dark);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 34px;
      margin: 0 0 1rem;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .subhead {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1 1 140px;
      background: var(--surface);
      border: 1px solid var(--parchment-dark);
      border-radius: 6px;
      padding: 10px 14px;
    }

    .stat .num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      color: var(--ink);
    }

    .stat .label {
      font-size: 12px;
      color: var(--muted);
    }

    .form-card {
      background: var(--surface);
      border: 1px solid var(--parchment-dark);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1.25rem;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    input[type="text"], select {
      flex: 1 1 220px;
      padding: 10px 12px;
      border: 1px solid var(--parchment-dark);
      border-radius: 6px;
      font-family: 'Source Serif 4', serif;
      font-size: 15px;
      background: var(--parchment);
      color: var(--charcoal);
    }

    input[type="text"]:focus, select:focus {
      outline: 2px solid var(--sage);
      outline-offset: 1px;
    }

    button.add-btn {
      background: var(--ink);
      color: var(--parchment);
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button.ghost-btn {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--parchment-dark);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter-group {
      margin-bottom: 14px;
    }

    .filter-group-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-deep);
      margin: 0 0 6px;
    }

    .filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--parchment-dark);
      border-radius: 20px;
      padding: 6px 13px;
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--ink);
      color: var(--parchment);
      border-color: var(--ink);
    }

    .empty {
      text-align: center;
      padding: 2.5rem 1rem;
      color: var(--muted);
      font-size: 15px;
    }

    .entries {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .entry {
      display: flex;
      flex-wrap: nowrap;
      background: var(--surface);
      border: 1px solid var(--parchment-dark);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(0,0,0,0.03);
      position: relative;
    }

    .half {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .half.task { flex: 1.25; }
    .half.reward { flex: 1; background: var(--parchment); }
    .half.reward.unlocked { background: #FEFCF6; }

    .perf {
      width: 1px;
      align-self: stretch;
      position: relative;
      border-left: 2px dashed var(--parchment-dark);
    }
    .perf::before, .perf::after {
      content: "";
      position: absolute;
      left: -9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--ink);
    }
    .perf::before { top: -9px; }
    .perf::after { bottom: -9px; }

    .stamp-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .stamp-btn:disabled { cursor: not-allowed; opacity: 0.4; }

    .circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--parchment-dark);
    }

    .label-small {
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .label-small.task-label { color: var(--muted); }
    .label-small.reward-label { color: var(--gold-deep); }

    .entry-title { font-size: 16px; }
    .entry-reward { font-size: 15px; }
    .done { text-decoration: line-through; color: var(--muted); }

    .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .remove-btn, .edit-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 12px;
      font-size: 16px;
    }

    .edit-btn {
      font-size: 15px;
      padding-right: 4px;
    }

    .error-msg {
      color: #8F3B2A;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
      white-space: pre-wrap;
    }

    .status {
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }

    .status strong {
      color: var(--ink);
    }

    .editing-banner {
      display: none;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid var(--parchment-dark);
      border-radius: 8px;
      background: #FFF8E8;
      color: var(--gold-deep);
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      flex: 0 0 26px;
      align-self: stretch;
      background: var(--parchment);
      border-right: 1px solid var(--parchment-dark);
    }
    .drag-handle:active { cursor: grabbing; }
    .reorder-disabled .drag-handle {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }
    .entry.sortable-chosen {
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
    }
    .entry.sortable-ghost {
      opacity: 0.35;
    }
    .reorder-hint {
      font-size: 11px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      margin: -8px 0 14px;
    }
    @media (max-width: 480px) {
      h1 { font-size: 26px; }

      /* Keep the row layout: drag-handle | task | perf | reward.
         Just make everything narrower so it fits. */
      .drag-handle {
        width: 20px;
        flex: 0 0 20px;
        font-size: 13px;
      }

      .half {
        padding: 10px 8px;
        gap: 8px;
      }

      .half.task { flex: 1.15; }
      .half.reward { flex: 1; }

      .stamp-btn, .circle {
        width: 30px;
        height: 30px;
      }

      .label-small { font-size: 9px; }
      .entry-title { font-size: 13px; line-height: 1.25; }
      .entry-reward { font-size: 13px; line-height: 1.25; }
      .meta { font-size: 10px; }

      .perf::before, .perf::after {
        width: 12px;
        height: 12px;
        left: -6px;
      }
    }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <div class="wrap">
    <div class="topbar">
      <p class="eyebrow">Ledger of tasks &amp; their rewards</p>
      <div class="auth-box">
        <span id="userLabel">Not signed in</span>
        <button id="authBtn" type="button">Sign in with Google</button>
      </div>
    </div>

    <h1>Earn it, then claim it</h1>
    <p class="subhead">Shared in real time through Firestore. No localStorage.</p>

    <div class="status" id="statusLine">Loading...</div>
    <div class="editing-banner" id="editingBanner">Editing an existing task.</div>
    <div class="stats" id="stats"></div>

    <div class="form-card">
      <div class="form-row">
        <input type="text" id="taskInput" placeholder="Task — e.g. Finish quarterly report" />
        <input type="text" id="rewardInput" placeholder="Reward — e.g. 30 min of a new game" />
      </div>
      <div class="form-row">
        <select id="ownerInput" aria-label="Assign to">
          <option value="Stephen">Stephen</option>
          <option value="Angeline">Angeline</option>
          <option value="shared">Shared</option>
        </select>
        <button class="add-btn" id="addBtn" type="button">Add to ledger</button>
        <button class="ghost-btn" id="cancelEditBtn" type="button" style="display:none;">Cancel</button>
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="filter-group">
      <div class="filter-group-label">Owner</div>
      <div class="filters" id="ownerFilters"></div>
    </div>

    <div class="filter-group">
      <div class="filter-group-label">Status</div>
      <div class="filters" id="filters"></div>
    </div>

    <div id="listArea"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      deleteDoc,
      doc,
      getDoc,
      onSnapshot,
      updateDoc,
      serverTimestamp,
      query,
      writeBatch
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAAOGdr4lx16d4ux3r9ZWKx1B-PfgCemL0",
      authDomain: "task-reward-ledger.firebaseapp.com",
      projectId: "task-reward-ledger",
      storageBucket: "task-reward-ledger.firebasestorage.app",
      messagingSenderId: "129914738583",
      appId: "1:129914738583:web:96fa5aa7d00c2ade61d6d2",
      measurementId: "G-T1DQKMNF09"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Each signed-in user belongs to exactly one "family" (a household
    // sharing one task list). Which family they belong to is looked up
    // from familyByEmail/{email} -> { familyId } after sign-in, rather
    // than being hardcoded, so different people signing in see only
    // their own family's tasks. See Firestore Security Rules for the
    // server-side enforcement of this boundary.
    let tasksRef = null;
    let tasksQuery = null;

    const state = {
      tasks: [],
      filter: "all",
      ownerFilter: "all",
      user: null,
      familyId: null
    };

    let editTaskId = null;
    let unsubscribeTasks = null;
    let sortableInstance = null;

    const els = {
      authBtn: document.getElementById("authBtn"),
      userLabel: document.getElementById("userLabel"),
      statusLine: document.getElementById("statusLine"),
      editingBanner: document.getElementById("editingBanner"),
      stats: document.getElementById("stats"),
      taskInput: document.getElementById("taskInput"),
      rewardInput: document.getElementById("rewardInput"),
      ownerInput: document.getElementById("ownerInput"),
      addBtn: document.getElementById("addBtn"),
      cancelEditBtn: document.getElementById("cancelEditBtn"),
      errorMsg: document.getElementById("errorMsg"),
      ownerFilters: document.getElementById("ownerFilters"),
      filters: document.getElementById("filters"),
      listArea: document.getElementById("listArea")
    };

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str ?? "");
      return div.innerHTML;
    }

    function showError(msg) {
      els.errorMsg.textContent = msg;
      els.errorMsg.style.display = "block";
    }

    function hideError() {
      els.errorMsg.style.display = "none";
      els.errorMsg.textContent = "";
    }

    function setStatus(msg) {
      els.statusLine.textContent = msg;
    }

    function ownerLabel(owner) {
      if (owner === "Stephen") return "Stephen";
      if (owner === "Angeline") return "Angeline";
      return "Shared";
    }

    function stampSvg(color, label) {
      return '<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">' +
        '<circle cx="20" cy="20" r="18" fill="none" stroke="' + color + '" stroke-width="2"/>' +
        '<circle cx="20" cy="20" r="14" fill="none" stroke="' + color + '" stroke-width="1"/>' +
        '<text x="20" y="24" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="500" fill="' + color + '" transform="rotate(-8 20 20)">' + label + '</text>' +
        '</svg>';
    }

    function syncEditBanner() {
      const editing = Boolean(editTaskId);
      els.editingBanner.style.display = editing ? "block" : "none";
      els.cancelEditBtn.style.display = editing ? "inline-block" : "none";
      els.addBtn.textContent = editing ? "Update task" : "Add to ledger";
    }

    function clearEditingMode() {
      editTaskId = null;
      els.taskInput.value = "";
      els.rewardInput.value = "";
      els.ownerInput.value = "Stephen";
      syncEditBanner();
    }

    function setEditingMode(task) {
      editTaskId = task.id;
      els.taskInput.value = task.title || "";
      els.rewardInput.value = task.reward || "";
      els.ownerInput.value = task.owner || "Stephen";
      syncEditBanner();
      els.taskInput.focus();
    }

    function renderStats() {
      const total = state.tasks.length;
      const tasksDone = state.tasks.filter((e) => e.taskDone).length;
      const rewardsClaimed = state.tasks.filter((e) => e.rewardDone).length;
      els.stats.innerHTML =
        '<div class="stat"><div class="num">' + total + '</div><div class="label">Entries</div></div>' +
        '<div class="stat"><div class="num">' + tasksDone + '</div><div class="label">Tasks done</div></div>' +
        '<div class="stat"><div class="num">' + rewardsClaimed + '</div><div class="label">Rewards claimed</div></div>';
    }

    function renderOwnerFilters() {
      const owners = [
        { key: "all", label: "All" },
        { key: "Stephen", label: "Stephen" },
        { key: "Angeline", label: "Angeline" },
        { key: "shared", label: "Shared" }
      ];

      els.ownerFilters.innerHTML = owners.map((o) => {
        const active = o.key === state.ownerFilter ? " active" : "";
        return '<button class="filter-btn' + active + '" data-owner-filter="' + o.key + '" type="button">' + o.label + '</button>';
      }).join("");

      els.ownerFilters.querySelectorAll("[data-owner-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.ownerFilter = btn.getAttribute("data-owner-filter");
          render();
        });
      });
    }

    function renderFilters() {
      const filters = [
        { key: "all", label: "All" },
        { key: "open", label: "Open" },
        { key: "earned", label: "Reward pending" },
        { key: "closed", label: "Closed out" }
      ];

      els.filters.innerHTML = filters.map((f) => {
        const active = f.key === state.filter ? " active" : "";
        return '<button class="filter-btn' + active + '" data-filter="' + f.key + '" type="button">' + f.label + '</button>';
      }).join("");

      els.filters.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.filter = btn.getAttribute("data-filter");
          render();
        });
      });
    }

    function renderList() {
      const visible = state.tasks.filter((e) => {
        if (state.ownerFilter !== "all" && e.owner !== state.ownerFilter) {
          return false;
        }
        if (state.filter === "open") return !e.taskDone;
        if (state.filter === "earned") return e.taskDone && !e.rewardDone;
        if (state.filter === "closed") return e.taskDone && e.rewardDone;
        return true;
      });

      if (visible.length === 0) {
        els.listArea.innerHTML = '<div class="empty">' +
          (state.tasks.length === 0
            ? "Nothing in the ledger yet. Add a task and its reward above."
            : "No entries match this filter.") +
          '</div>';
        return;
      }

      const reorderAllowed = state.filter === "all" && state.ownerFilter === "all";
      const reorderHint = reorderAllowed
        ? '<div class="reorder-hint">Drag the ⠿ handle to reorder.</div>'
        : '<div class="reorder-hint">Switch Owner/Status to "All" to drag-reorder.</div>';

      els.listArea.innerHTML = reorderHint +
        '<div class="entries' + (reorderAllowed ? "" : " reorder-disabled") + '">' + visible.map((e) => {
        const taskCircle = e.taskDone ? stampSvg("#6E8F73", "DONE") : '<div class="circle"></div>';
        const rewardCircle = e.rewardDone ? stampSvg("#C9973F", "CLAIM") : '<div class="circle"></div>';
        const hint = !e.taskDone ? '<div class="hint">Finish the task to unlock</div>' : "";
        const owner = e.owner ? ownerLabel(e.owner) : "Shared";
        const ownerMeta = '<div class="meta">Assigned to: ' + escapeHtml(owner) + '</div>';

        return (
          '<div class="entry" data-id="' + e.id + '">' +
            '<div class="drag-handle" aria-hidden="true">⠿</div>' +
            '<div class="half task">' +
              '<button class="stamp-btn" data-action="task" data-id="' + e.id + '" type="button" aria-label="Toggle task">' + taskCircle + '</button>' +
              '<div>' +
                '<div class="label-small task-label">Task</div>' +
                '<div class="entry-title' + (e.taskDone ? " done" : "") + '">' + escapeHtml(e.title) + '</div>' +
                ownerMeta +
              '</div>' +
            '</div>' +
            '<div class="perf"></div>' +
            '<div class="half reward' + (e.taskDone ? " unlocked" : "") + '">' +
              '<button class="stamp-btn" data-action="reward" data-id="' + e.id + '" type="button" ' + (e.taskDone ? "" : "disabled") + ' aria-label="Toggle reward">' + rewardCircle + '</button>' +
              '<div>' +
                '<div class="label-small reward-label">Reward</div>' +
                '<div class="entry-reward' + (e.rewardDone ? " done" : "") + '">' + escapeHtml(e.reward) + '</div>' +
                hint +
              '</div>' +
            '</div>' +
            '<button class="edit-btn" data-action="edit" data-id="' + e.id + '" type="button" aria-label="Edit entry">✎</button>' +
            '<button class="remove-btn" data-action="remove" data-id="' + e.id + '" type="button" aria-label="Remove entry">&times;</button>' +
          '</div>'
        );
      }).join("") + '</div>';

      els.listArea.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          const action = btn.getAttribute("data-action");
          const current = state.tasks.find((e) => e.id === id);
          try {
            if (action === "task") await toggleTask(id);
            if (action === "reward") await toggleReward(id);
            if (action === "remove") await removeEntry(id);
            if (action === "edit" && current) setEditingMode(current);
          } catch (err) {
            console.error(err);
            showError(err?.message || "Something went wrong.");
          }
        });
      });

      initSortable(reorderAllowed);
    }

    function initSortable(enabled) {
      if (sortableInstance) {
        sortableInstance.destroy();
        sortableInstance = null;
      }
      const container = els.listArea.querySelector(".entries");
      if (!container || !enabled || typeof Sortable === "undefined") return;

      sortableInstance = Sortable.create(container, {
        handle: ".drag-handle",
        animation: 150,
        ghostClass: "sortable-ghost",
        chosenClass: "sortable-chosen",
        onEnd: (evt) => {
          if (evt.oldIndex === evt.newIndex) return;
          const orderedIds = Array.from(container.children).map((el) => el.getAttribute("data-id"));
          persistOrder(orderedIds).catch((err) => {
            console.error(err);
            showError(err?.message || "Could not save new order.");
          });
        }
      });
    }

    async function persistOrder(orderedIds) {
      // orderedIds reflects the full list since reordering is only enabled
      // when both filters are "all", so it maps 1:1 onto state.tasks.
      const batch = writeBatch(db);
      orderedIds.forEach((id, index) => {
        batch.update(doc(db, "families", state.familyId, "tasks", id), {
          sortOrder: (index + 1) * 1000
        });
      });
      await batch.commit();
    }

    function render() {
      renderStats();
      renderOwnerFilters();
      renderFilters();
      renderList();
    }

    async function signIn() {
      hideError();
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (err) {
        console.error(err);
        showError(err?.message || "Sign-in failed.");
      }
    }

    async function signOutUser() {
      try {
        await signOut(auth);
      } catch (err) {
        console.error(err);
        showError(err?.message || "Sign-out failed.");
      }
    }

    async function saveTask() {
      hideError();

      const title = els.taskInput.value.trim();
      const reward = els.rewardInput.value.trim();
      const owner = els.ownerInput.value;

      if (!auth.currentUser) {
        showError("Please sign in before saving tasks.");
        return;
      }

      if (!state.familyId) {
        showError("Still loading your household — try again in a moment.");
        return;
      }

      if (!title) {
        showError("Task title cannot be empty.");
        return;
      }

      if (editTaskId) {
        await updateDoc(doc(db, "families", state.familyId, "tasks", editTaskId), {
          title,
          reward: reward || "No reward set",
          owner
        });
        clearEditingMode();
      } else {
        await addDoc(tasksRef, {
          title,
          reward,
          owner,
          taskDone:false,
          rewardDone:false,
          sortOrder: Date.now(),
          createdAt: serverTimestamp(),
          createdBy: auth.currentUser.uid
        });
        els.taskInput.value = "";
        els.rewardInput.value = "";
        els.ownerInput.value = "Stephen";
      }
    }

    async function toggleTask(id) {
      const current = state.tasks.find((e) => e.id === id);
      if (!current) return;

      const nowDone = !current.taskDone;
      await updateDoc(doc(db, "families", state.familyId, "tasks", id), {
        taskDone: nowDone,
        rewardDone: nowDone ? current.rewardDone : false
      });
    }

    async function toggleReward(id) {
      const current = state.tasks.find((e) => e.id === id);
      if (!current || !current.taskDone) return;

      await updateDoc(doc(db, "families", state.familyId, "tasks", id), {
        rewardDone: !current.rewardDone
      });
    }

    async function removeEntry(id) {
      await deleteDoc(doc(db, "families", state.familyId, "tasks", id));
      if (editTaskId === id) clearEditingMode();
    }

    function startListening() {
      if (unsubscribeTasks) unsubscribeTasks();

      tasksRef = collection(db, "families", state.familyId, "tasks");
      // No server-side orderBy: Firestore's orderBy silently excludes any
      // doc missing the field being ordered by. We sort client-side
      // instead (below) so older tasks without sortOrder still show up.
      tasksQuery = query(tasksRef);

      unsubscribeTasks = onSnapshot(tasksQuery, (snap) => {
        const docsData = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

        docsData.sort((a, b) => {
          const aHas = typeof a.sortOrder === "number";
          const bHas = typeof b.sortOrder === "number";
          if (aHas && bHas) return a.sortOrder - b.sortOrder;
          if (aHas) return -1;
          if (bHas) return 1;
          // Neither has sortOrder yet: fall back to creation time so
          // order stays stable until it gets backfilled below.
          const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return aTime - bTime;
        });

        state.tasks = docsData;
        setStatus("Live sync active: " + state.tasks.length + " task(s) loaded.");
        render();

        const missingSortOrder = docsData.some((t) => typeof t.sortOrder !== "number");
        if (missingSortOrder && auth.currentUser) {
          persistOrder(docsData.map((t) => t.id)).catch((err) => {
            console.error("Backfill of sortOrder failed:", err);
          });
        }
      }, (err) => {
        console.error(err);
        showError(err?.message || "Could not load tasks.");
        setStatus("Live sync unavailable.");
      });
    }

    onAuthStateChanged(auth, (user) => {
      state.user = user || null;
      state.familyId = null;

      if (!user) {
        els.userLabel.textContent = "Not signed in";
        els.authBtn.textContent = "Sign in with Google";
        setStatus("Sign in to view and edit the shared ledger.");
        if (unsubscribeTasks) {
          unsubscribeTasks();
          unsubscribeTasks = null;
        }
        state.tasks = [];
        clearEditingMode();
        render();
        return;
      }

      els.userLabel.textContent = user.displayName || user.email || "Signed in";
      els.authBtn.textContent = "Sign out";
      setStatus("Signed in as " + (user.displayName || user.email || "user") + ". Looking up your household...");

      getDoc(doc(db, "familyByEmail", user.email))
        .then((snap) => {
          if (!snap.exists() || !snap.data().familyId) {
            setStatus("Live sync unavailable.");
            showError(
              "This Google account (" + user.email + ") isn't set up on any household yet. " +
              "Ask whoever manages the app to add your email to a family."
            );
            return;
          }
          state.familyId = snap.data().familyId;
          hideError();
          setStatus("Signed in as " + (user.displayName || user.email || "user") + ". Loading shared ledger...");
          startListening();
        })
        .catch((err) => {
          console.error(err);
          setStatus("Live sync unavailable.");
          showError(err?.message || "Could not look up your household.");
        });
    });

    els.authBtn.addEventListener("click", () => {
      if (state.user) signOutUser();
      else signIn();
    });

    els.addBtn.addEventListener("click", () => {
      saveTask().catch((err) => {
        console.error(err);
        showError(err?.message || "Could not save task.");
      });
    });

    els.cancelEditBtn.addEventListener("click", () => {
      clearEditingMode();
    });

    els.taskInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") saveTask().catch((err) => {
        console.error(err);
        showError(err?.message || "Could not save task.");
      });
    });

    els.rewardInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") saveTask().catch((err) => {
        console.error(err);
        showError(err?.message || "Could not save task.");
      });
    });

    render();
    syncEditBanner();
    setStatus("Connecting to Firebase...");
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/task-reward-ledger/sw.js").catch(function (err) {
          console.warn("Service worker registration failed:", err);
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
